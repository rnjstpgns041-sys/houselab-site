name: 네이버 색인 요청

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 오전 8시 (한국 시간)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/indexnow.py
