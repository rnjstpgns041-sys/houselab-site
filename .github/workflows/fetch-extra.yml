name: 다른 블로그 사진 찾기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_extra.py", ".github/workflows/fetch-extra.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_extra.py
      - name: 결과를 별도 브랜치에 올리기 (사이트에는 반영 안 됨)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan extra-photos
          git rm -rq --cached .
          git add extra_out
          git commit -qm "다른 블로그 사진 후보"
          git push -f origin extra-photos
