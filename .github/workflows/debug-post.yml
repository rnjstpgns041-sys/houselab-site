name: 글 사진 조사

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/debug_post.py", ".github/workflows/debug-post.yml"]

permissions:
  contents: write

jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/debug_post.py
      - name: 결과를 별도 브랜치에 올리기 (사이트에는 반영 안 됨)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-post
          git rm -rq --cached .
          git add debug
          git commit -qm "글 사진 조사"
          git push -f origin debug-post
