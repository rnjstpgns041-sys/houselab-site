name: 네이버 노출 키워드 확인

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-5pkgwx]
    paths: [".github/scripts/naver_check.py", ".github/workflows/naver-check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/naver_check.py
      - name: 결과를 별도 브랜치에 올리기 (사이트에는 반영 안 됨)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan naver-check
          git rm -rq --cached .
          git add naver
          git commit -qm "네이버 노출 확인 결과"
          git push -f origin naver-check
