name: 실제 사이트 화면 찍기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/live_shot.js", ".github/workflows/live-shot.yml"]

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: sleep 60 && mkdir -p shots && node scripts/live_shot.js
      - name: 결과를 별도 브랜치에 올리기 (사이트에는 반영 안 됨)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-shots
          git rm -rq --cached .
          git add shots
          git commit -qm "실제 사이트 화면"
          git push -f origin live-shots
