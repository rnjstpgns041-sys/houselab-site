<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 하우스랩 건설</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --night: #0D0D0B; --gold: #C8A96A; --ivory: #F2EEE6; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(900px 420px at 50% -10%, #2A2416 0%, var(--night) 60%); color: var(--ivory); font-family: Pretendard, -apple-system, system-ui, sans-serif; text-align: center; }
.n { font-size: 64px; font-weight: 800; color: var(--gold); letter-spacing: -0.04em; margin: 0; }
h1 { font-size: 24px; margin: 8px 0 10px; letter-spacing: -0.03em; }
p { color: #B5AFA2; margin: 0 0 28px; line-height: 1.6; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
a { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 999px; font-weight: 700; font-size: 17px; text-decoration: none; }
.call { background: linear-gradient(135deg, #E8D5A6, #C8A96A 55%, #A88A4E); color: #16150F; }
.home { border: 1px solid rgba(242,238,230,.4); color: var(--ivory); }
</style>
</head>
<body>
<main>
  <p class="n">404</p>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>집수리 문의는 전화나 문자로 바로 주세요.</p>
  <div class="row">
    <a class="call" href="tel:01059317025">전화하기 010-5931-7025</a>
    <a class="home" href="/">홈페이지로 가기</a>
  </div>
</main>
</body>
</html>
